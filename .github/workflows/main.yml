name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip RoseController-Prototype-0.6.zip -d project

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found"
            find project -maxdepth 5 -type f
            exit 1
          fi

          chmod +x "$GRADLEW"
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

          APK=$(find . -path "*/build/outputs/apk/debug/*.apk" -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/Rose-Controller.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rose-Controller-APK
          path: apk-output/Rose-Controller.apk
