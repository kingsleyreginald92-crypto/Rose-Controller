name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q RoseController-Prototype-0.6.zip -d project

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        shell: bash
        run: |
          PROJECT_DIR="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android Gradle project not found"
            find project -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "Building from: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          APP_BUILD_FILE="$(find . -type f -path "*/app/build.gradle.kts" -print -quit)"

          if [ -z "$APP_BUILD_FILE" ]; then
            echo "app/build.gradle.kts not found"
            find . -type f -name "build.gradle.kts" | sort
            exit 1
          fi

          echo "Removing obsolete Kotlin Android plugin from: $APP_BUILD_FILE"
          sed -i '/org\.jetbrains\.kotlin\.android/d' "$APP_BUILD_FILE"

          echo "Building APK..."
          gradle assembleDebug --no-daemon

          APK="$(find . -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "APK not found"
            find . -type f -path "*/build/outputs/*/*.apk" | sort
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/Rose-Controller.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rose-Controller-APK
          path: apk-output/Rose-Controller.apk
